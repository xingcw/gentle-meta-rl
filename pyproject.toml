[project]
name = "gentle"
version = "0.1.0"
description = "GENTLE (AAAI'24) - Generalizable Task Representation Learning for Offline Meta-RL"
# 3.11 is the floor for jax >= 0.7, which is the first release whose CUDA
# kernels work on Blackwell (sm_120); 0.6.x miscompiles there.
requires-python = "==3.11.*"
dependencies = [
    # --- core numerics / DL ---
    "numpy>=1.26,<2.0",
    "torch>=2.7",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    # --- RL env API (old gym API: 4-tuple step, env.seed) ---
    "gym==0.25.2",
    # --- SAC data-generation stack (pytorch_sac uses hydra 0.11 API) ---
    "hydra-core==0.11.3",
    "omegaconf==1.4.1",
    "setuptools<81",           # hydra 0.11 imports pkg_resources
    # --- logging / CLI / misc ---
    "click>=8.1",
    "tensorboard>=2.14",
    "tensorboardx>=2.6",
    "termcolor>=2.0",
    "gtimer>=1.0.0b5",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "pillow>=10.0",
    "python-dateutil>=2.8",
    "tqdm>=4.66",
    # --- JAX pipeline (gentle_jax) ---
    # The accelerator backend is an extra: --extra cuda for GPUs, --extra tpu
    # for TPU VMs. Bare jax alone runs on CPU.
    "jax>=0.7.1",
    "flax>=0.10.7",
    "optax>=0.2.8",
    "chex>=0.1.90",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.7.1"]
tpu = ["jax[tpu]>=0.7.1"]
# Only needed for Cheetah/Ant/Hopper/Walker (MuJoCo) domains.
mujoco = [
    "mujoco-py==2.1.2.14",
    "cython<3",
]

[tool.uv]
# a single environment cannot hold both accelerator plugins
conflicts = [[{ extra = "cuda" }, { extra = "tpu" }]]

# torch cu128 wheels (RTX 5090 / sm_120 requires CUDA 12.8+)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.setuptools]
py-modules = []
